name: Validate site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/v06.js
      - name: Build production output
        run: npm run build
      - name: Verify critical output files
        run: |
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/v06.js
          test -f dist/assets/v06.css
          grep -q "DIGITAL TOOLS" dist/index.html
          grep -q "projectInquiryForm" dist/index.html
          grep -q "supportForm" dist/index.html
          grep -q "nhqewuniroljxgaefkgx.supabase.co" dist/assets/config.js
